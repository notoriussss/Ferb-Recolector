# Parámetros de visión: rangos HSV de cada color y geometría de la cámara.
#
# Rangos: OpenCV usa H 0–179, S y V 0–255. Cada grupo de 6 números es un rango
# [h_min, s_min, v_min, h_max, s_max, v_max]; un color puede tener varios rangos seguidos
# (el rojo usa dos porque el tono da la vuelta).
#
# TODO (rol 2): estos rangos están calibrados con los cubos de la SIMULACIÓN (Webots).
# Hay que recalibrarlos con los cubos reales y la luz del laboratorio.

cube_detector:
  ros__parameters:
    color_names: [rojo, naranja, amarillo, verde, azul, morado]
    hsv:
      rojo:     [0, 110, 100, 6, 255, 255, 173, 110, 100, 179, 255, 255]
      naranja:  [8, 120, 100, 18, 255, 255]
      amarillo: [20, 100, 100, 35, 255, 255]
      verde:    [45, 80, 50, 90, 255, 255]
      azul:     [100, 110, 90, 130, 255, 255]
      morado:   [145, 60, 40, 171, 255, 255]

    # Geometría de la cámara: tomada del PROTO RecolectorUCAB (OV5647 ~54°, a 11 cm del piso,
    # inclinada 24° hacia abajo). TODO medir en el robot real.
    camera:
      hfov_rad: 0.94
      height_m: 0.11
      tilt_rad: 0.42

    filter:
      min_area_px: 40
      cube_size_m: 0.025
      min_size_ratio: 0.45       # ancho visto / ancho esperado de un cubo a esa distancia
      max_size_ratio: 2.2
      ignore_touching_bottom: true   # la pala se ve en el borde de abajo de la imagen
      max_distance_m: 2.5

    publish_debug_image: true

web_viewer:
  ros__parameters:
    port: 8080
    max_fps_hz: 15.0
    jpeg_quality: 75
    color_names: [rojo, naranja, amarillo, verde, azul, morado]
    # topes del control manual (WASD) a velocidad 100 %; el máximo del robot es ~0,24 m/s
    teleop_max_linear_m_s: 0.15
    teleop_max_angular_rad_s: 1.0

camera_node:
  ros__parameters:
    device: "0"        # /dev/video0; o un pipeline de GStreamer
    width_px: 640
    height_px: 480
    fps_hz: 15.0
