# Collector parameters (pins, speeds, thresholds).
# Keys are /**/<node> so the parameters apply with and without a namespace (/ferb/...).
# A bare node name does NOT match a node launched with namespace=robot.
# TODO: each owner adds their nodes' parameters here, with the unit in the name.

/**/behavior_fsm:
  ros__parameters:
    enabled: true
    # colours the robot looks for (changed at runtime from web_viewer)
    # every colour except red, track rule of 2026-10-22
    target_colors: [orange, yellow, green, blue, purple]
    # stops when the cube is this far from the camera. With the PROTO geometry,
    # 0.17 m leaves the cube about 5 cm in front of the scoop tip. TODO measure.
    stop_distance_m: 0.17
    resume_margin_m: 0.04
    slow_down_distance_m: 0.45
    max_forward_m_s: 0.12        # the robot's maximum is ~0.24 m/s
    min_forward_m_s: 0.03
    turn_gain: 1.5               # rad/s per rad of angle error
    max_turn_rad_s: 0.8
    align_tolerance_rad: 0.35    # with more error, turn without moving forward
    search_turn_rad_s: 0.5
    lost_timeout_s: 1.0
    control_rate_hz: 20.0
    cubes_timeout_s: 1.0         # without recent detections, stay still
    teleop_timeout_s: 0.3        # without recent WASD, automatic mode resumes

/**/obstacle_guard:
  ros__parameters:
    slow_distance_m: 0.30
    stop_distance_m: 0.15
    slow_factor: 0.5
    range_timeout_s: 0.5
    cmd_timeout_s: 0.5
    rate_hz: 20.0
    require_heartbeat: true
    require_pose: false
    peer_pose_topic: /phineas/pose
    pose_max_age_s: 0.5
    front_cone_deg: 60.0
    peer_slow_distance_m: 0.60
    peer_stop_distance_m: 0.40
    avoid_turn_rad_s: 0.6
    deadlock_time_s: 3.0
    escape_turn_rad_s: 0.8

/**/fleet_link:
  ros__parameters:
    robot_name: ferb
    heartbeat_timeout_s: 2.0
    state_rate_hz: 2.0
    renew_period_s: 20.0
