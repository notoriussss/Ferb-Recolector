# Tool configuration for the whole repo. Each ROS package has its own setup.py.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "install", "log"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.ruff.lint.isort]
known-first-party = ["mobile_base", "vision", "recolector_interfaces"]
